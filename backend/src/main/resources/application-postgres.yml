# ==========================================================================
#  SecureVault — postgres/prod profile (PostgreSQL + Redis).
#  Activated by docker-compose or:  --spring.profiles.active=postgres
# ==========================================================================
spring:
  datasource:
    # DB_URL can be set directly, or assembled from host/port/name components
    # (which is how the Render blueprint wires up the managed database).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securevault}}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:securevault}
    password: ${DB_PASSWORD:securevault}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  h2:
    console:
      enabled: false
