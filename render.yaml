# ==========================================================================
#  Render blueprint — SecureVault BACKEND + PostgreSQL.
#  (The React frontend deploys separately on Vercel — see DEPLOY.md.)
#
#  Deploy: Render Dashboard → New → Blueprint → pick this repo → Apply.
# ==========================================================================
databases:
  - name: securevault-db
    databaseName: securevault
    user: securevault
    plan: free

services:
  - type: web
    name: securevault-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: securevault-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: securevault-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: securevault-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: securevault-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: securevault-db
          property: password
      # Disable Redis auto-config in the cloud (no Redis provisioned on free tier).
      - key: SPRING_AUTOCONFIGURE_EXCLUDE
        value: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      # ⚠️  Demo secrets — rotate for anything real (Render can generate your own).
      - key: JWT_SECRET
        value: c2VjdXJldmF1bHQtc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZC0yMDI1IQ==
      - key: VAULT_MASTER_KEY
        value: 0123456789abcdef0123456789abcdef
      # Allowed browser origins — the live Vercel frontend (production + legacy alias).
      - key: CORS_ORIGINS
        value: https://securevault-singh28priyankas-projects.vercel.app,https://frontend-alpha-navy-48.vercel.app
