# ==========================================================================
#  SecureVault — full stack (PostgreSQL + Redis + Spring Boot + React/Nginx)
#  Usage:  docker compose up --build
#  Frontend → http://localhost:3000     Backend → http://localhost:8080
# ==========================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securevault
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD: securevault
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securevault"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/securevault
      DB_USERNAME: securevault
      DB_PASSWORD: securevault
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ⚠️  Override these secrets in any real deployment.
      JWT_SECRET: c2VjdXJldmF1bHQtc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZC0yMDI1IQ==
      VAULT_MASTER_KEY: 0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
