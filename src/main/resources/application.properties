spring.application.name=securevault

spring.datasource.url=jdbc:postgresql://localhost:5432/securevault
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.stat=DEBUG
logging.level.org.springframework.cache=TRACE
logging.level.com.example.securevault.service=INFO

securevault.seed.enabled=${SEED_ENABLED:false}

aes.secret.key=${AES_SECRET_KEY:1234567890123456}

jwt.secret=${JWT_SECRET:change-this-super-secret-key-of-at-least-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Redis / Spring Cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
securevault.cache.redis-enabled=${REDIS_CACHE_ENABLED:true}
securevault.cache.ttl-minutes=${CACHE_TTL_MINUTES:30}
