spring.datasource.url=jdbc:h2:mem:securevault;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

aes.secret.key=1234567890123456
jwt.secret=change-this-super-secret-key-of-at-least-32-chars
jwt.expiration-ms=86400000

securevault.seed.enabled=false

# Use in-memory Spring Cache for tests (no Redis required)
securevault.cache.redis-enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.stat=WARN
logging.level.org.springframework.cache=DEBUG
logging.level.com.example.securevault.service=INFO
